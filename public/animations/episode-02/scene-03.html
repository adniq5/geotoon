<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bagaimana Satelit Mengamati Bumi - Animasi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
<style>
:root{--bg:#0e1a33;--ink:#f4f7ff;--panel:#17264a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar button{font:800 14px/1 "Nunito",system-ui,sans-serif;border:2px solid transparent;background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer}
.bar button:hover{border-color:#5d78b8}
.bar button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bar button[aria-pressed="true"]{background:#fff;color:#0e1a33}
.stage{position:relative;width:100%;aspect-ratio:1536/1024;border-radius:14px;overflow:hidden;background:#000}
.stage img,.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.grp{transition:opacity .35s}
.dim{opacity:.08}
.step{fill:rgba(255,230,120,.16);stroke:#ffe27a;stroke-width:5;opacity:0;transition:opacity .3s}
.note{font-size:14px;opacity:.85;margin:10px 2px 0}
</style></head><body>
<div class="wrap">
<div class="bar" role="toolbar" aria-label="Kontrol animasi">
<button id="play" aria-pressed="false">Jeda</button>
<button data-m="semua" aria-pressed="true">Semua</button>
<button data-m="pasif" aria-pressed="false">Hanya pasif</button>
<button data-m="aktif" aria-pressed="false">Hanya aktif</button>
<button data-m="orbit" aria-pressed="false">Hanya orbit</button>
</div>

<defs><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>

</div>
<p class="note">Titik kuning: energi Matahari menuju Bumi dan dipantulkan ke sensor (pasif). Titik merah muda: energi radar yang dipancarkan lalu kembali ke sensor (aktif).</p>
</div>
<script>
const NS="http://www.w3.org/2000/svg";
const P={"pasif": [[[505, 280], [688, 393]], [[485, 290], [662, 447]], [[468, 298], [612, 482]], [[665, 525], [712, 392]], [[742, 538], [800, 392]], [[618, 118], [545, 175]], [[620, 120], [592, 182]], [[622, 120], [650, 172]]], "aktif": [[[1226, 102], [1205, 172]], [[1236, 102], [1252, 172]]], "orbit": [[[905, 163], [762, 156]], [[1018, 167], [1090, 184], [1165, 224]], [[905, 300], [1045, 290]]]}, PING={"aktif": [0, 1], "orbit": [2]}, BOXES=[[398, 703, 248, 152], [668, 703, 235, 152], [928, 703, 235, 152], [312, 868, 190, 128], [505, 868, 182, 128], [690, 868, 180, 128], [873, 868, 187, 128], [1065, 868, 187, 128]];
const COL={pasif:"#ffd54a",aktif:"#ff6fb0",orbit:"#e8f6ff"};
function mk(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e}
function prep(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,L,T:L[L.length-1]}}
function at(o,u){const d=u*o.T;let i=1;while(i<o.L.length-1&&o.L[i]<d)i++;const s=(d-o.L[i-1])/((o.L[i]-o.L[i-1])||1),a=o.pts[i-1],b=o.pts[i];return[a[0]+(b[0]-a[0])*s,a[1]+(b[1]-a[1])*s]}
const dots=[];
for(const m in P){
 const g=document.getElementById(m);
 P[m].forEach((pts,i)=>{
  const o=prep(pts),pp=(PING[m]||[]).includes(i);
  for(let k=0;k<4;k++){
   const c=mk("circle",{r:8,cx:-50,cy:-50,fill:COL[m],filter:"url(#glow)",opacity:0});
   g.appendChild(c);dots.push({c,o,pp,ph:k/4+i*0.07});
  }
 });
}
const sg=document.getElementById("steps"),rects=[];
BOXES.forEach(b=>{const r=mk("rect",{class:"step",x:b[0],y:b[1],width:b[2],height:b[3],rx:14});sg.appendChild(r);rects.push(r)});
const play=document.getElementById("play");
let paused=false,acc=0,last=null;
function setPaused(v){paused=v;play.textContent=v?"Putar":"Jeda";play.setAttribute("aria-pressed",String(v))}
play.onclick=()=>setPaused(!paused);
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
 const m=b.dataset.m;
 document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
 for(const g of ["pasif","aktif","orbit"])document.getElementById(g).classList.toggle("dim",m!=="semua"&&m!==g);
});
function frame(ts){
 if(last===null)last=ts;
 if(!paused)acc+=ts-last;
 last=ts;
 const t=acc/1000;
 for(const d of dots){
  const w=((t/2.4)+d.ph)%1;
  const u=d.pp?(w<0.5?w*2:(1-w)*2):w;
  const p=at(d.o,u);
  d.c.setAttribute("cx",p[0]);d.c.setAttribute("cy",p[1]);
  d.c.setAttribute("r",5+5*Math.min(1,w/0.15));
  d.c.setAttribute("opacity",w<0.12?w/0.12:(w>0.85?(1-w)/0.15:1));
 }
 const idx=Math.floor((t%(BOXES.length*1.5))/1.5);
 rects.forEach((r,i)=>r.style.opacity=(i===idx)?1:0);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
