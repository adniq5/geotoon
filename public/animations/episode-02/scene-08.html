  --bg: #e8f0f6;
  --panel: #ffffff;
  --ink: #14232e;
  --muted: #526879;
  --line: #c9d9e5;
  --rona: #2b82d4;
  --warna: #e04a89;
  --bentuk: #e89a14;
  --gH: #c98a00;
  --gM: #d02a78;
  --font-display: "Baloo 2", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  /* ilustrasi: permukaan balon selalu putih di kedua tema */
  --bub-bg: #ffffff;
  --bub-ink: #222a36;
  --bub-readH: #a45f00;
  --bub-readM: #bd1d68;
  --curH: rgba(255, 207, 64, .62);
  --curHglow: rgba(255, 190, 30, .85);
  --curM: rgba(255, 120, 175, .5);
  --curMglow: rgba(255, 70, 150, .75);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1822; --panel: #15242f; --ink: #e6f0f7; --muted: #94a9b8; --line: #263a4a;
    --rona: #5aa8f0; --warna: #ff7ab2; --bentuk: #ffb43a; --gH: #ffd24a; --gM: #ff86bd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1822; --panel: #15242f; --ink: #e6f0f7; --muted: #94a9b8; --line: #263a4a;
  --rona: #5aa8f0; --warna: #ff7ab2; --bentuk: #ffb43a; --gH: #ffd24a; --gM: #ff86bd;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.page { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 28px; display: flex; flex-direction: column; gap: 12px; }

/* kontrol */
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.phases { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 800 14px/1 var(--font-display); letter-spacing: .02em; border: 2px solid var(--c); color: var(--ink); background: var(--panel); padding: 9px 14px 8px; border-radius: 999px; cursor: pointer; transition: background .25s, box-shadow .25s, color .25s; }
.chip[data-n="1"] { --c: var(--rona); } .chip[data-n="2"] { --c: var(--warna); } .chip[data-n="3"] { --c: var(--bentuk); }
.chip.on { background: var(--c); color: #101820; box-shadow: 0 0 14px 2px var(--c); }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: 800 14px/1 var(--font-display); border: 2px solid var(--line); background: var(--panel); color: var(--ink); padding: 9px 14px 8px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 92px; }
.btn:hover { border-color: var(--muted); }
select.btn { padding-right: 8px; }
:is(.btn, .chip, .sg, select):focus-visible { outline: 3px solid var(--rona); outline-offset: 2px; }

/* panggung */
.stage { --u: .65px; position: relative; width: 100%; aspect-ratio: 1536 / 1024; max-width: 100%; container-type: inline-size; background: var(--img) center / 100% 100% no-repeat; border-radius: 14px; overflow: hidden; user-select: none; box-shadow: 0 6px 28px rgba(10, 30, 50, .22); }
.stage > * { position: absolute; }
.gray { inset: 0; background: var(--img) center / 100% 100%; filter: grayscale(1) contrast(1.12) brightness(1.03); clip-path: inset(9.1% 26.6% 37.5% 27.1%); opacity: 0; transition: opacity .6s; pointer-events: none; }
.gray.on { opacity: 1; }
svg.hl { inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.hi { opacity: 0; transition: opacity .4s; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 calc(var(--u) * 7) var(--gl, #fff)); }
.hi.show { opacity: 1; }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.5s ease, opacity .4s; }
.draw.show { stroke-dashoffset: 0; }
.bracket { stroke-dasharray: 12 9; animation: march 1s linear infinite; }
@keyframes march { to { stroke-dashoffset: -21; } }

.lab { border: calc(var(--u) * 4) solid #fff; border-radius: calc(var(--u) * 10); box-shadow: 0 0 calc(var(--u) * 22) calc(var(--u) * 5) #fff5b0; opacity: 0; transition: opacity .35s; pointer-events: none; }
.lab.on { opacity: 1; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.07); box-shadow: 0 0 calc(var(--u) * 34) calc(var(--u) * 9) #fff5b0; } }

.lens { border-radius: 50%; border: calc(var(--u) * 6) solid #fff; box-shadow: 0 0 calc(var(--u) * 30) calc(var(--u) * 8) rgba(255, 255, 255, .6), 0 calc(var(--u) * 6) calc(var(--u) * 20) rgba(0, 0, 0, .45); background: var(--img) no-repeat; opacity: 0; transform: scale(.55); transition: left .9s cubic-bezier(.5, 0, .2, 1), top .9s cubic-bezier(.5, 0, .2, 1), background-position .9s cubic-bezier(.5, 0, .2, 1), opacity .4s, transform .5s, filter .5s; pointer-events: none; z-index: 3; }
.lens.on { opacity: 1; transform: scale(1); }
.lens::after { content: ""; position: absolute; width: 22%; height: 5%; right: -17%; bottom: -8%; background: linear-gradient(#a8672b, #6e3d14); border: calc(var(--u) * 3) solid #3b2008; border-radius: 999px; transform: rotate(45deg); }
.lens[data-m="gray"] { filter: grayscale(1) contrast(1.15); }
.lens[data-m="color"] { filter: saturate(1.4) contrast(1.05); }
.lens[data-m="ir"] { filter: hue-rotate(-100deg) saturate(1.9) brightness(1.1); }
.lens[data-m="shape"] { filter: contrast(1.12); }

.card, .thumb { pointer-events: none; transition: box-shadow .35s, background .35s, opacity .35s; }
.card { border-radius: calc(var(--u) * 24); --c: #fff; }
.card[data-n="1"] { --c: #2b8cf0; } .card[data-n="2"] { --c: #ff4f93; } .card[data-n="3"] { --c: #ffa91d; }
.card.on { box-shadow: 0 0 0 calc(var(--u) * 5) var(--c), 0 0 calc(var(--u) * 34) calc(var(--u) * 8) var(--c); animation: cardpulse 1.4s ease-in-out infinite; }
@keyframes cardpulse { 50% { box-shadow: 0 0 0 calc(var(--u) * 6) var(--c), 0 0 calc(var(--u) * 50) calc(var(--u) * 14) var(--c); } }
.card.dim { background: rgba(244, 248, 252, .55); }
.thumb { border-radius: calc(var(--u) * 8); }
.thumb.on { box-shadow: 0 0 0 calc(var(--u) * 5) #fff, 0 0 calc(var(--u) * 24) calc(var(--u) * 7) #fff8c0; animation: tpulse 1s ease-in-out infinite; }
@keyframes tpulse { 50% { box-shadow: 0 0 0 calc(var(--u) * 6) #fff, 0 0 calc(var(--u) * 36) calc(var(--u) * 12) #fff8c0; } }
.thumb.dim { background: rgba(10, 22, 34, .5); }
.banner { border-radius: calc(var(--u) * 16); box-shadow: 0 0 0 0 rgba(255, 220, 90, 0); transition: box-shadow .4s; pointer-events: none; }
.banner.on { box-shadow: 0 0 0 calc(var(--u) * 4) #ffd84d, 0 0 calc(var(--u) * 30) calc(var(--u) * 8) #ffd84d; animation: cardpulse 1.4s ease-in-out infinite; --c: #ffd84d; }

.tag { border-radius: calc(var(--u) * 12); opacity: 0; transition: opacity .3s; pointer-events: none; }
.tag.on { opacity: 1; animation: cardpulse 1.1s ease-in-out infinite; }
.tag.H { --c: #ffc928; } .tag.M { --c: #ff5aa5; }

  }
  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  document.getElementById('restart').addEventListener('click', function () { seek(0); });
  document.getElementById('speed').addEventListener('change', function (e) { speed = +e.target.value; });
  chips.forEach(function (c) { c.addEventListener('click', function () { seek(+c.dataset.go); }); });

  /* ---------- ukuran huruf balon ---------- */
  function fit() {
    var u = stage.clientWidth / W; stage.style.setProperty('--u', u + 'px');
    Object.keys(bubs).forEach(function (n) {
      var b = bubs[n], inner = b.inner, fs = 17.5 * u, min = 2 * u;
      inner.style.fontSize = fs + 'px';
      while (inner.scrollHeight > b.clientHeight - 2 * u * 6 && fs > min) { fs -= 0.2 * Math.max(u, .5); inner.style.fontSize = fs + 'px'; }
    });
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage); else window.addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  fit();

  /* keadaan awal: semua teks terlihat, belum ada sorotan */
  buildCap(0);
  stage.classList.add('paused');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  setBtn(); playBtn.textContent = 'Putar';
  requestAnimationFrame(frame);
  if (!reduce) setTimeout(function () { if (!started) play(); }, 900);
})();
</script>

</html>
