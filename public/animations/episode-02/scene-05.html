<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mengenal Jenis-Jenis Citra - Animasi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
<style>
:root{--bg:#0e1a33;--ink:#f4f7ff;--panel:#17264a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar button{font:800 14px/1 "Nunito",system-ui,sans-serif;border:2px solid transparent;background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer}
.bar button:hover{border-color:#5d78b8}
.bar button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bar button[aria-pressed="true"]{background:#fff;color:#0e1a33}
.stage{position:relative;width:100%;aspect-ratio:1536/1024;border-radius:14px;overflow:hidden;background:#000}
.zoom{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
.zoom img,.zoom svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.grp{transition:opacity .35s}
.dim{opacity:.06}
.note{font-size:14px;opacity:.85;margin:10px 2px 0}
</style></head><body>

function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const gsp=document.getElementById("sprites"),gd=document.getElementById("dialog"),gm=document.getElementById("materi"),ga=document.getElementById("alat");
const sp={};
for(const k in S){const s=S[k];sp[k]=mk("image",{x:s.x,y:s.y,width:s.w,height:s.h,href:"data:image/webp;base64,"+s.d},gsp)}
const bub=C.bubbles.map(b=>mk("rect",{x:b[0],y:b[1],width:b[2],height:b[3],rx:40,fill:"rgba(255,235,140,.10)",stroke:"#ffe27a","stroke-width":6,filter:"url(#glow)",opacity:0},gd));
const secs=C.secs.map(b=>mk("rect",{x:b[0]-4,y:b[1]-4,width:b[2]+8,height:b[3]+8,rx:14,fill:"rgba(255,255,255,.14)",stroke:"#ffe27a","stroke-width":6,filter:"url(#glow)",opacity:0},gm));
const R=C.right;const rr=document.getElementById("rrect");["x","y","width","height"].forEach((k,i)=>rr.setAttribute(k,R[i]));
const cg=mk("g",{"clip-path":"url(#rclip)"},gm);
const sw=mk("rect",{x:R[0]-110,y:R[1],width:110,height:R[3],fill:"url(#sweep)",opacity:0},cg);
const lf=C.left,flashL=mk("rect",{x:lf[0],y:lf[1],width:lf[2],height:lf[3],fill:"#fff",opacity:0},ga);
const flashC=mk("circle",{cx:C.lens[0],cy:C.lens[1],r:20,fill:"#fff",filter:"url(#glow)",opacity:0},ga);
const rings=[0,1,2].map(()=>mk("circle",{cx:C.radar[0],cy:C.radar[1],r:14,fill:"none",stroke:"#7ff0ff","stroke-width":4,filter:"url(#glow)",opacity:0},ga));
const noz=mk("circle",{cx:C.noz[0],cy:C.noz[1],r:14,fill:"#bfe9ff",filter:"url(#glow)",opacity:0},ga);
const zoom=document.getElementById("zoom"),play=document.getElementById("play");
let paused=false,acc=0,last=null;
function setPaused(v){paused=v;play.textContent=v?"Putar":"Jeda";play.setAttribute("aria-pressed",String(v))}
play.onclick=()=>setPaused(!paused);
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
 const md=b.dataset.m;
 document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
 gd.classList.toggle("dim",md==="materi"||md==="alat");
 gm.classList.toggle("dim",md==="dialog"||md==="alat");
 ga.classList.toggle("dim",md==="dialog"||md==="materi");
});
const env=f=>Math.pow(Math.sin(Math.PI*f),0.6);
const TAU=2*Math.PI;
function put(k,dx,dy,rot){const p=C.piv[k];sp[k].setAttribute("transform",`translate(${dx.toFixed(2)} ${dy.toFixed(2)}) rotate(${rot.toFixed(3)} ${p[0]} ${p[1]})`)}
function frame(ts){
 if(last===null)last=ts;
 if(!paused)acc+=ts-last;
 last=ts;
 const t=acc/1000;
 const w=TAU*t/26,k=0.5-0.5*Math.cos(w);
 zoom.style.transform=`scale(${(1+0.03*k).toFixed(4)})`;
 // perangkat
 put("planeH",7*Math.sin(TAU*t/5),3*Math.sin(TAU*t/3.3),2.5*Math.sin(TAU*t/5+.5));
 put("camera",0,0.8*Math.sin(TAU*t/2.6),1.5*Math.sin(TAU*t/3.4));
 put("satTR",0,1.5*Math.sin(TAU*t/4.5+1),3.5*Math.sin(TAU*t/6));
 put("planeB",6*Math.sin(TAU*t/4.6),2*Math.sin(TAU*t/3.1),2*Math.sin(TAU*t/4.6+.4));
 put("drone",0,4*Math.sin(TAU*t/2.2),2*Math.sin(TAU*t/3.1));
 put("satM",0,2*Math.sin(TAU*t/4+0.5),5*Math.sin(TAU*t/5.5));
 put("radar",0,2*Math.sin(TAU*t/4.2+1),4*Math.sin(TAU*t/5));
 // kilat kamera dan foto udara
 const ff=(t%5)/5,fl=ff<0.08?1-ff/0.08:0;
 flashC.setAttribute("opacity",fl.toFixed(3));flashC.setAttribute("r",18+14*(ff/0.08>1?1:ff/0.08));
 flashL.setAttribute("opacity",(0.38*fl).toFixed(3));
 // gelombang radar
 rings.forEach((c,i)=>{const f=((t/2)+i/3)%1;c.setAttribute("r",14+34*f);c.setAttribute("opacity",(0.8*(1-f)).toFixed(3))});
 const fp=0.5+0.5*Math.sin(t*3.2);noz.setAttribute("r",9+9*fp);noz.setAttribute("opacity",(0.2+0.4*fp).toFixed(3));
 // balon bergantian
 const bi=Math.floor((t%10)/5),bf=((t%10)%5)/5;
 bub.forEach((r,i)=>r.setAttribute("opacity",i===bi?env(bf).toFixed(3):0));
 // bagian materi bergantian
 const N=secs.length,D=2,si=Math.floor((t%(N*D))/D),sf=((t%(N*D))%D)/D;
 secs.forEach((r,i)=>r.setAttribute("opacity",i===si?env(sf).toFixed(3):0));
 // sapuan spektral pada citra nonfoto
 const sg=(t/4)%1;sw.setAttribute("x",R[0]-110+sg*(R[2]+110));sw.setAttribute("opacity",(0.9*Math.sin(Math.PI*sg)).toFixed(3));
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
