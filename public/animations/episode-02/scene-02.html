<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penginderaan Jauh - Animasi Arah Energi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
<style>
:root{--bg:#0e1a33;--ink:#f4f7ff;--pasif:#ffc83d;--aktif:#ff5fa2;--panel:#17264a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar button{font:800 14px/1 inherit;font-family:inherit;border:2px solid transparent;background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer}
.bar button:hover{border-color:#5d78b8}
.bar button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bar button[aria-pressed="true"]{background:#fff;color:#0e1a33}
.bar .sp{flex:1}
.stage{position:relative;width:100%;aspect-ratio:1536/1024;border-radius:14px;overflow:hidden;background:#000}
.stage img,.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.grp{transition:opacity .35s}
.dim{opacity:.08}
.step{fill:rgba(255,230,120,.18);stroke:#ffe27a;stroke-width:5;opacity:0;transition:opacity .3s}
.note{font-size:14px;opacity:.85;margin:10px 2px 0}
</style></head><body>

<button data-m="aktif" aria-pressed="false">Hanya aktif</button>
</div>

<svg viewBox="0 0 1536 1024" id="svg" aria-hidden="true">
<defs>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g id="pasif" class="grp"></g>
<g id="aktif" class="grp"></g>
<g id="steps"></g>
</svg>
</div>
<p class="note">Titik kuning menunjukkan aliran energi pada sistem pasif (Matahari ke objek, lalu dipantulkan ke sensor). Titik merah muda menunjukkan sistem aktif (sensor memancarkan energi, lalu energi kembali ke sensor). Kotak kuning di bagian bawah menyorot tahap proses secara bergantian.</p>
</div>
<script>
const NS="http://www.w3.org/2000/svg";
const P={
 pasif:[[505,188,548,398],[535,188,612,455],[715,225,600,340],[695,495,735,312],[730,530,782,315]],
 aktif:[[1070,205,922,500],[1085,205,992,505],[1058,525,1060,200]]
};
const COL={pasif:"#ffd54a",aktif:"#ff6fb0"};
function mk(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e}
const dots=[];
for(const m in P){
 const g=document.getElementById(m);
 P[m].forEach((p,i)=>{
  for(let k=0;k<4;k++){
   const c=mk("circle",{r:8,cx:-50,cy:-50,fill:COL[m],filter:"url(#glow)",opacity:0});
   g.appendChild(c);
   dots.push({c,p,ph:k/4+i*0.07});
  }
 });
}
const boxes=[[55,843,163,145],[240,843,215,145],[478,843,225,145],[730,843,228,145],[985,843,215,145],[1225,843,265,145]];
const sg=document.getElementById("steps"),rects=[];
boxes.forEach(b=>{const r=mk("rect",{class:"step",x:b[0],y:b[1],width:b[2],height:b[3],rx:14});sg.appendChild(r);rects.push(r)});
const stage=document.getElementById("stage"),play=document.getElementById("play");
let paused=false,acc=0,last=null;
function setPaused(v){paused=v;play.textContent=v?"Putar":"Jeda";play.setAttribute("aria-pressed",String(v))}
play.onclick=()=>setPaused(!paused);
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
 const m=b.dataset.m;
 document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
 document.getElementById("pasif").classList.toggle("dim",m==="aktif");
 document.getElementById("aktif").classList.toggle("dim",m==="pasif");
});
function frame(ts){
 if(last===null)last=ts;
 if(!paused)acc+=ts-last;
 last=ts;
 const t=acc/1000;
 for(const d of dots){
  const u=((t/2.4)+d.ph)%1,p=d.p;
  d.c.setAttribute("cx",p[0]+(p[2]-p[0])*u);
  d.c.setAttribute("cy",p[1]+(p[3]-p[1])*u);
  d.c.setAttribute("r",5+5*Math.min(1,u/0.15));
  d.c.setAttribute("opacity",u<0.12?u/0.12:(u>0.85?(1-u)/0.15:1));
 }
 const idx=Math.floor((t%9)/1.5);
 rects.forEach((r,i)=>r.style.opacity=(i===idx)?1:0);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
