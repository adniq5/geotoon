<title>Tiga Tahap Interpretasi Citra - Animasi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
<style>
:root{--bg:#0e1a33;--ink:#f4f7ff;--panel:#17264a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar button{font:800 14px/1 "Nunito",system-ui,sans-serif;border:2px solid transparent;background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer}
.bar button:hover{border-color:#5d78b8}
.bar button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bar button[aria-pressed="true"]{background:#fff;color:#0e1a33}
.stage{position:relative;width:100%;aspect-ratio:1536/1024;border-radius:14px;overflow:hidden;background:#000}
.zoom{position:absolute;inset:0;transform-origin:50% 45%;will-change:transform}
.zoom img,.zoom svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.grp{transition:opacity .35s}
.dim{opacity:.06}
.note{font-size:14px;opacity:.85;margin:10px 2px 0}
</style></head><body>

function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const gsp=document.getElementById("sprites"),gd=document.getElementById("dialog"),gt=document.getElementById("tahap"),ga=document.getElementById("alat");
const sp={};for(const k in S){const s=S[k];sp[k]=mk("image",{x:s.x,y:s.y,width:s.w,height:s.h,href:"data:image/webp;base64,"+s.d},gsp)}
const bub=C.bubbles.map(b=>mk("rect",{x:b[0],y:b[1],width:b[2],height:b[3],rx:40,fill:"rgba(255,235,140,.10)",stroke:"#ffe27a","stroke-width":6,filter:"url(#glow)",opacity:0},gd));
const cards=C.cards.map(b=>mk("rect",{x:b[0]-3,y:b[1]-3,width:b[2]+6,height:b[3]+6,rx:16,fill:"rgba(255,255,255,.10)",stroke:"#ffe27a","stroke-width":6,filter:"url(#glow)",opacity:0},gt));
const boxes=C.boxes.map(b=>mk("rect",{x:b[0]-3,y:b[1]-3,width:b[2]+6,height:b[3]+6,rx:14,fill:"rgba(255,255,255,.14)",stroke:"#ffe27a","stroke-width":6,filter:"url(#glow)",opacity:0},gt));
const labs=C.labels.map(b=>mk("rect",{x:b[0]-5,y:b[1]-5,width:b[2]+10,height:b[3]+10,rx:10,fill:"rgba(255,255,255,.2)",stroke:"#fff6a8","stroke-width":5,filter:"url(#glow)",opacity:0},gt));
const dots=C.dots.map(p=>mk("circle",{cx:p[0],cy:p[1],r:10,fill:"none",stroke:"#fff","stroke-width":5,filter:"url(#glow)",opacity:0},gt));
const M=C.map,mr=document.getElementById("mrect");["x","y","width","height"].forEach((k,i)=>mr.setAttribute(k,M[i]));
const lg=mk("g",{"clip-path":"url(#mclip)"},gt);
const lens=mk("circle",{r:60,cx:-100,cy:-100,fill:"rgba(255,255,255,.07)",stroke:"#fff","stroke-width":5,filter:"url(#glow)",opacity:.9},lg);
const glint=mk("path",{d:"M-38 -22 A44 44 0 0 1 -18 -42",fill:"none",stroke:"#fff","stroke-width":6,"stroke-linecap":"round",opacity:.9},lg);
const flows=[];C.flows.forEach(f=>{for(let k=0;k<2;k++){const c=mk("circle",{r:7,cx:-50,cy:-50,fill:f.c,filter:"url(#glow)",opacity:0},gt);flows.push({c,p:f.p,ph:k/2})}});
const bl=mk("circle",{cx:C.bulb[0],cy:C.bulb[1],r:30,fill:"#ffe94a",filter:"url(#glow)",opacity:0},ga);
const ge=document.getElementById("gell");["cx","cy","rx","ry"].forEach((k,i)=>ge.setAttribute(k,C.globe[i]));
const gg=mk("g",{"clip-path":"url(#gclip)"},ga);
const shine=mk("rect",{x:-40,y:C.globe[1]-C.globe[3],width:36,height:C.globe[3]*2,fill:"url(#shine)",transform:"skewX(-14)",opacity:0},gg);
const zoom=document.getElementById("zoom"),play=document.getElementById("play");
let paused=false,acc=0,last=null;
function setPaused(v){paused=v;play.textContent=v?"Putar":"Jeda";play.setAttribute("aria-pressed",String(v))}
play.onclick=()=>setPaused(!paused);
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
 const md=b.dataset.m;
 document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
 gd.classList.toggle("dim",md==="tahap"||md==="alat");
 gt.classList.toggle("dim",md==="dialog"||md==="alat");
 ga.classList.toggle("dim",md==="dialog"||md==="tahap");
});
const env=f=>Math.pow(Math.sin(Math.PI*f),0.6);
function put(k,dx,dy,rot,sy){const p=C.piv[k];sp[k].setAttribute("transform",`translate(${dx.toFixed(2)} ${dy.toFixed(2)}) translate(${p[0]} ${p[1]}) rotate(${rot.toFixed(3)}) scale(1 ${(sy||1).toFixed(4)}) translate(${-p[0]} ${-p[1]})`)}
function frame(ts){
 if(last===null)last=ts;
 if(!paused)acc+=ts-last;
 last=ts;
 const t=acc/1000;
 const w=TAU*t/26,k=0.5-0.5*Math.cos(w);
 zoom.style.transform=`translate(${(-0.4*k).toFixed(3)}%,0) scale(${(1+0.03*k).toFixed(4)})`;
 // ikon
 put("titleMag",2*Math.sin(TAU*t/4.2+1),1.5*Math.sin(TAU*t/3),5*Math.sin(TAU*t/4.2));
 put("detMag",1.5*Math.sin(TAU*t/3.6),0,6*Math.sin(TAU*t/3.6+1.5));
 put("doc",0,2*Math.sin(TAU*t/3.2),4*Math.sin(TAU*t/3.2+.5));
 put("chart",0,0,0,1+0.07*Math.sin(TAU*t/2.4));
 put("pin",0,-6*(0.5-0.5*Math.cos(TAU*t/1.8)),0);
 put("bulb",0,1.2*Math.sin(TAU*t/2.4),4*Math.sin(TAU*t/2.4));
 const bp=0.5+0.5*Math.sin(TAU*t/2.4);bl.setAttribute("r",26+16*bp);bl.setAttribute("opacity",(0.15+0.3*bp).toFixed(3));
 const gf=(t/4.5)%1,gx=C.globe[0]-C.globe[2]-20+gf*(C.globe[2]*2+40);shine.setAttribute("x",gx);shine.setAttribute("opacity",(0.8*Math.sin(Math.PI*gf)).toFixed(3));
 // balon
 const bi=Math.floor((t%10)/5),bf=((t%10)%5)/5;
 bub.forEach((r,i)=>r.setAttribute("opacity",i===bi?env(bf).toFixed(3):0));
 // tiga tahap
 const D=3.4,si=Math.floor((t%(3*D))/D),sf=((t%(3*D))%D)/D;
 for(let i=0;i<3;i++){const o=i===si?env(sf):0;cards[i].setAttribute("opacity",o.toFixed(3));boxes[i].setAttribute("opacity",o.toFixed(3))}
 // label di peta
 const N=5,LD=1.6,li=Math.floor((t%(N*LD))/LD),lf=((t%(N*LD))%LD)/LD;
 for(let i=0;i<N;i++){labs[i].setAttribute("opacity",(i===li?env(lf):0).toFixed(3));dots[i].setAttribute("r",i===li?10+22*lf:10);dots[i].setAttribute("opacity",i===li?(0.95*(1-lf*0.8)).toFixed(3):0)}
 const lx=780+300*Math.sin(TAU*t/13),ly=235+110*Math.sin(TAU*t/8.7+1);
 lens.setAttribute("cx",lx);lens.setAttribute("cy",ly);glint.setAttribute("transform",`translate(${lx} ${ly})`);
 // aliran panah
 flows.forEach(f=>{const u=((t/1.4)+f.ph)%1,a=f.p[0],b=f.p[1];
  f.c.setAttribute("cx",a[0]+(b[0]-a[0])*u);f.c.setAttribute("cy",a[1]+(b[1]-a[1])*u);f.c.setAttribute("opacity",(0.95*Math.sin(Math.PI*u)).toFixed(3))});
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
