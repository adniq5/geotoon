<style>
:root{--bg:#0e1a33;--ink:#f4f7ff;--panel:#17264a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar button{font:800 14px/1 "Nunito",system-ui,sans-serif;border:2px solid transparent;background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer}
.bar button:hover{border-color:#5d78b8}
.bar button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bar button[aria-pressed="true"]{background:#fff;color:#0e1a33}
.stage{position:relative;width:100%;aspect-ratio:1536/1024;border-radius:14px;overflow:hidden;background:#000}
.zoom{position:absolute;inset:0;transform-origin:50% 45%;will-change:transform}
.zoom img,.zoom svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.grp{transition:opacity .35s}
.dim{opacity:.06}
.note{font-size:14px;opacity:.85;margin:10px 2px 0}

const C={"bubbles": [[5, 160, 415, 455], [1148, 40, 380, 510]], "labels": [[517, 188, 97, 32], [633, 358, 96, 32], [952, 157, 117, 32], [728, 475, 150, 34], [982, 400, 112, 32]], "marks": [[572, 262], [718, 425], [890, 185], [838, 553], [1042, 475]], "circles": [[378, 900, 70], [555, 900, 74], [738, 900, 80], [930, 900, 78], [1120, 898, 76]], "pills": [[310, 965, 132, 30], [488, 965, 140, 30], [665, 965, 145, 30], [840, 962, 180, 34], [1053, 965, 143, 30]], "map": [410, 75, 765, 565], "compass": [1130, 110], "finger": [738, 598], "tip": [1367, 957], "sprite": [1240, 820, 285, 175], "globe": [108, 732, 94, 92]};
function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const gd=document.getElementById("dialog"),gp=document.getElementById("peta"),gr=document.getElementById("ruang");
const sat=document.getElementById("sat");
["x","y","width","height"].forEach((k,i)=>sat.setAttribute(k,C.sprite[i]));
const bub=C.bubbles.map(b=>mk("rect",{x:b[0],y:b[1],width:b[2],height:b[3],rx:40,fill:"rgba(255,235,140,.10)",stroke:"#ffe27a","stroke-width":6,filter:"url(#glow)",opacity:0},gd));
// peta
const m=C.map;["x","y","width","height"].forEach((k,i)=>document.getElementById("mrect").setAttribute(k,m[i]));
const mg=mk("g",{"clip-path":"url(#mclip)"},gp);
const sw=mk("rect",{x:m[0]-120,y:m[1],width:120,height:m[3],fill:"url(#sweep)",opacity:0},mg);
const lab=C.labels.map(b=>mk("rect",{x:b[0]-6,y:b[1]-6,width:b[2]+12,height:b[3]+12,rx:10,fill:"rgba(255,255,255,.18)",stroke:"#fff6a8","stroke-width":5,filter:"url(#glow)",opacity:0},gp));
const mar=C.marks.map(p=>mk("circle",{cx:p[0],cy:p[1],r:10,fill:"none",stroke:"#fff","stroke-width":5,filter:"url(#glow)",opacity:0},gp));
const cir=C.circles.map(c=>mk("circle",{cx:c[0],cy:c[1],r:c[2]+3,fill:"rgba(255,255,255,.10)",stroke:"#7ff0ff","stroke-width":6,filter:"url(#glow)",opacity:0},gp));
const pil=C.pills.map(b=>mk("rect",{x:b[0]-4,y:b[1]-4,width:b[2]+8,height:b[3]+8,rx:10,fill:"rgba(255,255,255,.18)",stroke:"#fff6a8","stroke-width":5,filter:"url(#glow)",opacity:0},gp));
const comp=mk("circle",{cx:C.compass[0],cy:C.compass[1],r:20,fill:"none",stroke:"#fff","stroke-width":4,filter:"url(#glow)",opacity:0},gp);
const fing=mk("circle",{cx:C.finger[0],cy:C.finger[1],r:14,fill:"none",stroke:"#ffe27a","stroke-width":5,filter:"url(#glow)",opacity:0},gp);
// ruang
const flare=mk("circle",{cx:C.tip[0],cy:C.tip[1]+6,r:18,fill:"#bfe9ff",filter:"url(#glow)",opacity:0},gr);
const ge=document.getElementById("gell");["cx","cy","rx","ry"].forEach((k,i)=>ge.setAttribute(k,C.globe[i]));
const gg=mk("g",{"clip-path":"url(#gclip)"},gr);
const shine=mk("rect",{x:-40,y:C.globe[1]-C.globe[3],width:36,height:C.globe[3]*2,fill:"url(#shine)",transform:"skewX(-14)",opacity:0},gg);
const zoom=document.getElementById("zoom"),play=document.getElementById("play");
let paused=false,acc=0,last=null;
function setPaused(v){paused=v;play.textContent=v?"Putar":"Jeda";play.setAttribute("aria-pressed",String(v))}
play.onclick=()=>setPaused(!paused);
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
 const md=b.dataset.m;
 document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
 gd.classList.toggle("dim",md==="peta"||md==="ruang");
 gp.classList.toggle("dim",md==="dialog"||md==="ruang");
 gr.classList.toggle("dim",md==="dialog"||md==="peta");
});
const env=f=>Math.pow(Math.sin(Math.PI*f),0.6);
function frame(ts){
 if(last===null)last=ts;
 if(!paused)acc+=ts-last;
 last=ts;
 const t=acc/1000;
 const w=2*Math.PI*t/26,k=0.5-0.5*Math.cos(w);
 zoom.style.transform=`translate(${(-0.8*k).toFixed(3)}%,0) scale(${(1+0.035*k).toFixed(4)})`;
 // satelit
 const ang=4*Math.sin(2*Math.PI*t/6),dy=2*Math.sin(2*Math.PI*t/4.5+1);
 sat.setAttribute("transform",`translate(0 ${dy.toFixed(2)}) rotate(${ang.toFixed(3)} ${C.tip[0]} ${C.tip[1]})`);
 const fp=0.5+0.5*Math.sin(t*3.2);flare.setAttribute("r",14+14*fp);flare.setAttribute("opacity",(0.2+0.4*fp).toFixed(3));
 // globe
 const gf=(t/4.5)%1,gx=C.globe[0]-C.globe[2]-20+gf*(C.globe[2]*2+40);
 shine.setAttribute("x",gx);shine.setAttribute("opacity",(0.8*Math.sin(Math.PI*gf)).toFixed(3));
 // balon bergantian
 const bi=Math.floor((t%10)/5),bf=((t%10)%5)/5;
 bub.forEach((r,i)=>r.setAttribute("opacity",i===bi?env(bf).toFixed(3):0));
 // sapuan cahaya pada peta
 const sf=(t/5)%1;sw.setAttribute("x",m[0]-120+sf*(m[2]+120));sw.setAttribute("opacity",(0.9*Math.sin(Math.PI*sf)).toFixed(3));
 // label, penanda, lingkaran, dan label bawah menyala bersama
 const N=C.labels.length,si=Math.floor((t%(N*2.2))/2.2),ff=((t%(N*2.2))%2.2)/2.2;
 for(let i=0;i<N;i++){const o=i===si?env(ff):0;
  lab[i].setAttribute("opacity",o.toFixed(3));cir[i].setAttribute("opacity",o.toFixed(3));pil[i].setAttribute("opacity",o.toFixed(3));
  const on=i===si;mar[i].setAttribute("r",on?10+24*ff:10);mar[i].setAttribute("opacity",on?(0.95*(1-ff*0.8)).toFixed(3):0);}
 const cf=(t*0.7)%1;comp.setAttribute("r",16+16*cf);comp.setAttribute("opacity",(0.8*(1-cf)).toFixed(3));
 const pf=(t*0.9+0.4)%1;fing.setAttribute("r",12+22*pf);fing.setAttribute("opacity",(0.9*(1-pf)).toFixed(3));
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
