<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Dimulai - Animasi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
<style>
:root{--bg:#0e1a33;--ink:#f4f7ff;--panel:#17264a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar button{font:800 14px/1 "Nunito",system-ui,sans-serif;border:2px solid transparent;background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer}
.bar button:hover{border-color:#5d78b8}
.bar button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bar button[aria-pressed="true"]{background:#fff;color:#0e1a33}
.stage{position:relative;width:100%;aspect-ratio:1536/1024;border-radius:14px;overflow:hidden;background:#000}
.zoom{position:absolute;inset:0;transform-origin:58% 38%;will-change:transform}
.zoom img,.zoom svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.grp{transition:opacity .35s}
.dim{opacity:.06}
.note{font-size:14px;opacity:.85;margin:10px 2px 0}
</style></head><body>
<div class="wrap">
<div class="bar" role="toolbar" aria-label="Kontrol animasi">
<button id="play" aria-pressed="false">Jeda</button>
<button data-m="semua" aria-pressed="true">Semua</button>
<button data-m="dialog" aria-pressed="false">Percakapan</button>
<button data-m="satelit" aria-pressed="false">Satelit dan citra</button>
<button data-m="ruang" aria-pressed="false">Perangkat di ruangan</button>
</div>

<g id="dialog" class="grp"></g><g id="satelit" class="grp"></g><g id="ruang" class="grp"></g>
</svg></div></div>
</div>
<script>
const NS="http://www.w3.org/2000/svg";
const C={"bubbles": [[20, 300, 305, 205], [330, 405, 320, 205], [815, 375, 340, 215], [1230, 450, 295, 175]], "thumbs": [[1262, 15, 213, 143], [1322, 175, 156, 87], [1148, 265, 159, 95], [1325, 265, 155, 87], [1148, 372, 160, 86], [1325, 360, 157, 85]], "apex": [1085, 192], "left": [935, 272], "right": [1090, 300], "orbit": [[722, 133], [780, 105], [850, 88], [915, 80]], "pulses": [[288, 545, "#ffe27a"], [607, 632, "#8fd0ff"], [1255, 668, "#ffe27a"]], "spark": [1158, 88], "tip": [1087, 192], "sprite": [905, 20, 430, 225], "screens": [[318, 728, 100, 86], [1168, 735, 102, 92]], "globe": [30, 840, 86, 102]};
function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const gd=document.getElementById("dialog"),gs=document.getElementById("satelit"),gr=document.getElementById("ruang");
const sat=document.getElementById("sat");
sat.setAttribute("x",C.sprite[0]);sat.setAttribute("y",C.sprite[1]);sat.setAttribute("width",C.sprite[2]);sat.setAttribute("height",C.sprite[3]);
const bub=C.bubbles.map(b=>mk("rect",{x:b[0],y:b[1],width:b[2],height:b[3],rx:40,fill:"rgba(255,235,140,.10)",stroke:"#ffe27a","stroke-width":6,filter:"url(#glow)",opacity:0},gd));
const pul=C.pulses.map(p=>mk("circle",{cx:p[0],cy:p[1],r:20,fill:p[2],filter:"url(#glow)",opacity:0},gd));
const th=C.thumbs.map(b=>mk("rect",{x:b[0],y:b[1],width:b[2],height:b[3],rx:8,fill:"rgba(255,255,255,.14)",stroke:"#7ff0ff","stroke-width":5,filter:"url(#glow)",opacity:0},gs));
const scans=[0,1,2].map(()=>mk("line",{stroke:"#c8ecff","stroke-width":6,"stroke-linecap":"round",filter:"url(#glow)",opacity:0},gs));
const spark=mk("circle",{cx:C.spark[0],cy:C.spark[1],r:10,fill:"#fff",filter:"url(#glow)",opacity:0},gs);
const O=C.orbit,L=[0];for(let i=1;i<O.length;i++)L.push(L[i-1]+Math.hypot(O[i][0]-O[i-1][0],O[i][1]-O[i-1][1]));
function orb(u){const d=u*L[L.length-1];let i=1;while(i<L.length-1&&L[i]<d)i++;const s=(d-L[i-1])/(L[i]-L[i-1]),a=O[i-1],b=O[i];return[a[0]+(b[0]-a[0])*s,a[1]+(b[1]-a[1])*s]}
const od=[0,1,2,3,4].map(()=>mk("circle",{r:8,cx:-50,cy:-50,fill:"#e8f6ff",filter:"url(#glow)",opacity:0},gs));
// perangkat di ruangan
const scr=C.screens.map(b=>mk("rect",{x:b[0],y:b[1],width:b[2],height:b[3],rx:6,fill:"#7fd3ff",opacity:0,style:"mix-blend-mode:screen"},gr));
const ge=document.getElementById("gell");
["cx","cy","rx","ry"].forEach((k,i)=>ge.setAttribute(k,C.globe[i]));
const gg=mk("g",{"clip-path":"url(#gclip)"},gr);
const shine=mk("rect",{x:-40,y:C.globe[1]-C.globe[3],width:34,height:C.globe[3]*2,fill:"url(#shine)",transform:"skewX(-14)",opacity:0},gg);
const zoom=document.getElementById("zoom"),play=document.getElementById("play");
let paused=false,acc=0,last=null;
function setPaused(v){paused=v;play.textContent=v?"Putar":"Jeda";play.setAttribute("aria-pressed",String(v))}
play.onclick=()=>setPaused(!paused);
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
 const m=b.dataset.m;
 document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
 gd.classList.toggle("dim",m==="satelit"||m==="ruang");
 gs.classList.toggle("dim",m==="dialog"||m==="ruang");
 gr.classList.toggle("dim",m==="dialog"||m==="satelit");
});
const env=f=>Math.pow(Math.sin(Math.PI*f),0.6);
function frame(ts){
 if(last===null)last=ts;
 if(!paused)acc+=ts-last;
 last=ts;
 const t=acc/1000;
 const w=2*Math.PI*t/26,k=0.5-0.5*Math.cos(w);
 zoom.style.transform=`translate(${(-1.2*k).toFixed(3)}%,0) scale(${(1+0.035*k).toFixed(4)})`;
 // satelit mengayun mengarahkan sensor (berputar di ujung sensor agar berkas tetap menempel)
 const ang=3*Math.sin(2*Math.PI*t/7),dy=1.5*Math.sin(2*Math.PI*t/5+1);
 sat.setAttribute("transform",`translate(0 ${dy.toFixed(2)}) rotate(${ang.toFixed(3)} ${C.tip[0]} ${C.tip[1]})`);
 // balon
 const si=Math.floor((t%12)/3),sf=((t%12)%3)/3;
 bub.forEach((r,i)=>r.setAttribute("opacity",i===si?env(sf).toFixed(3):0));
 pul.forEach((c,i)=>{const f=((t*0.9)+i*0.33)%1;c.setAttribute("r",14+16*f);c.setAttribute("opacity",(0.55*(1-f)).toFixed(3))});
 // panel citra
 const ti=Math.floor((t%7.2)/1.2),tf=((t%7.2)%1.2)/1.2;
 th.forEach((r,i)=>r.setAttribute("opacity",i===ti?env(tf).toFixed(3):0));
 // gelombang sensor
 scans.forEach((l,i)=>{const p=((t/1.8)+i/3)%1,a=C.apex,le=C.left,ri=C.right;
  l.setAttribute("x1",a[0]+(le[0]-a[0])*p);l.setAttribute("y1",a[1]+(le[1]-a[1])*p);
  l.setAttribute("x2",a[0]+(ri[0]-a[0])*p);l.setAttribute("y2",a[1]+(ri[1]-a[1])*p);
  l.setAttribute("opacity",(0.85*Math.sin(Math.PI*p)).toFixed(3))});
 od.forEach((c,i)=>{const u=((t/4)+i/5)%1,p=orb(u);c.setAttribute("cx",p[0]);c.setAttribute("cy",p[1]);c.setAttribute("opacity",(0.9*Math.sin(Math.PI*u)).toFixed(3))});
 const sp=0.5+0.5*Math.sin(t*3);spark.setAttribute("r",6+12*sp);spark.setAttribute("opacity",(0.35+0.55*sp).toFixed(3));
 // layar laptop berkedip lembut
 scr.forEach((r,i)=>{const f=0.5+0.5*Math.sin(t*2.2+i*2);const g=Math.sin(t*9+i)>0.93?0.25:0;r.setAttribute("opacity",(0.10+0.16*f+g).toFixed(3))});
 // kilau melintas di globe
 const gf=(t/4.5)%1,gx=C.globe[0]-C.globe[2]-20+gf*(C.globe[2]*2+40);
 shine.setAttribute("x",gx);shine.setAttribute("opacity",(0.8*Math.sin(Math.PI*gf)).toFixed(3));
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
