@keyframes scan{from{top:-25%}to{top:105%}}

@keyframes bulb{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.35)}}
.card{border-radius:18px;pointer-events:none;animation:cg 6s infinite;animation-delay:var(--d);opacity:0}

.c9{animation:cg9 13.5s infinite}
