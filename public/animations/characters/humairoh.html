.line{mix-blend-mode:multiply;border-radius:6px;opacity:0;clip-path:inset(0 100% 0 0)}

@keyframes sweep{0%{opacity:1;clip-path:inset(0 100% 0 0)}50%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 0)}}
.L{background:linear-gradient(90deg,rgba(255,214,70,.45),rgba(255,170,0,.85) 96%,rgba(255,120,0,1))}

.scan{left:22.1%;top:1%;width:59.2%;height:32%;overflow:hidden;border-radius:10px;pointer-events:none}

@keyframes scan{from{top:-25%}to{top:105%}}
.bulb{left:78.2%;top:53%;width:5%;height:7.5%;border-radius:50%;background:radial-gradient(circle,rgba(255,235,120,.8),transparent 70%);mix-blend-mode:screen;animation:bulb 1.8s ease-in-out infinite}
@keyframes bulb{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.35)}}
.card{border-radius:18px;pointer-events:none;animation:cg 6s infinite;animation-delay:var(--d);opacity:0}
@keyframes cg{0%,100%{opacity:0}8%,28%{opacity:1;box-shadow:inset 0 0 0 3px var(--c),0 0 30px 6px var(--c)}38%{opacity:0}}
.c9{animation:cg9 13.5s infinite}

.shine{overflow:hidden;transform:rotate(-4deg);mix-blend-mode:screen}
.shine::after{content:"";position:absolute;top:0;bottom:0;width:18%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:sh 3.2s ease-in-out infinite}
@keyframes sh{from{left:-25%}to{left:110%}}

.hand{transform-origin:18% 66%;animation:point 1.4s ease-in-out infinite}
@keyframes point{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(1.4%,-1%) rotate(4deg)}}
.mag{transform-origin:31% 4%;animation:mag 3s ease-in-out infinite}

@keyframes eg{0%,100%{box-shadow:0 0 20px 2px rgba(90,190,255,.35)}50%{box-shadow:0 0 60px 14px rgba(120,220,255,.85)}}

.float{animation:fl 3.6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7%)}}
